<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://sdk.scdn.co blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.scdn.co; media-src 'self' blob: https://*.scdn.co; connect-src 'self' https://api.spotify.com https://*.spotify.com wss://*.spotify.com https://*.scdn.co; frame-src 'self' https://sdk.scdn.co blob:; worker-src 'self' blob:; child-src 'self' blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winify — Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,700;0,900;1,900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Saira+Condensed:wght@600;700&amp;display=swap">
<style>
  body { margin: 0; background: #0b0d0f; font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #ff8a2b; }
  a:hover { color: #ffb066; }
  .sa-win { transition: filter .12s ease, transform .1s ease; }
  .sa-win:hover { filter: brightness(1.09); }
  .sa-win:active { transform: translateY(2px); }
  .sa-cta { transition: background .18s ease, box-shadow .18s ease, border-color .18s ease, transform .1s ease; }
  .sa-cta:active { transform: translateY(3px); }
  .sa-cta:disabled { filter: grayscale(.9) brightness(.58); cursor: not-allowed; }
  .sa-checkwrap:hover .sa-check { filter: brightness(1.12); }
  .sa-check { transition: filter .12s ease; }
  button:focus-visible, a:focus-visible { outline: 3px solid #ffb066; outline-offset: 5px; }
  input:focus-visible + .sa-check { outline: 3px solid #ffb066; outline-offset: 5px; }
  @keyframes sa-eq { 0% { transform: scaleY(.2); } 100% { transform: scaleY(1); } }
  .sa-live .sa-bar { animation: sa-eq 780ms ease-in-out infinite alternate; }
  @keyframes sa-eq2 { 0% { transform: scaleY(.35); } 40% { transform: scaleY(1); } 65% { transform: scaleY(.5); } 100% { transform: scaleY(.8); } }
  @keyframes sa-eq3 { 0% { transform: scaleY(.15); } 30% { transform: scaleY(.7); } 55% { transform: scaleY(.3); } 100% { transform: scaleY(1); } }
  .sa-live .sa-bar.sa-v2 { animation-name: sa-eq2; }
  .sa-live .sa-bar.sa-v3 { animation-name: sa-eq3; }
  /* Not connected: a shallow sine, low amplitude, phase-offset per bar. */
  @keyframes sa-wave { 0% { transform: scaleY(.26); } 100% { transform: scaleY(.58); } }
  .sa-wave .sa-bar { animation: sa-wave 1700ms ease-in-out infinite alternate; }
  /* Error: no movement at all, held flat. */
  .sa-still .sa-bar { animation: none; transform: scaleY(.2); }
  @keyframes sa-pulse { 0% { opacity: .5; } 38% { opacity: 1; } 52% { opacity: .72; } 70% { opacity: 1; } 84% { opacity: .82; } 100% { opacity: 1; } }
  .sa-led { animation: sa-pulse 5.4s ease-in-out infinite alternate; }
  @keyframes sa-sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  .sa-sweep { animation: sa-sweep 1200ms linear infinite; }
  @keyframes sa-spin { to { transform: rotate(360deg); } }
  .sa-spin { animation: sa-spin .9s linear infinite; }
</style>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #08090b; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #sa-stage { width: 1280px; height: 1070px; flex: none; transform-origin: center center; }
  sc-if, sc-for { display: contents; }
  /* Screen switching only — no visual changes to the design above.
     .is-active reproduces the centring the stage had as a flex child of body. */
  .sa-screen { display: none; }
  .sa-screen.is-active { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; }
  #app-screen { color: #c9d1d9; font-family: 'JetBrains Mono', ui-monospace, monospace; }
</style>
</head>
<body>
<section id="login-screen" class="sa-screen is-active"><div id="sa-stage"></div></section>
<section id="app-screen" class="sa-screen"><div>
  <p id="status">Not logged in</p>
  <p id="player-status">Player: not started</p>
  <!-- Temporary test rig: proves in-app audio works. The Winamp skin will
       replace these controls and call window.WinifyPlayer.* instead. -->
  <p>
    <button id="btn-prev" type="button">Prev</button>
    <button id="btn-play" type="button">Play</button>
    <button id="btn-pause" type="button">Pause</button>
    <button id="btn-next" type="button">Next</button>
    <button id="btn-transfer" type="button">Transfer playback here</button>
  </p>
  <p><label>Volume <input id="vol" type="range" min="0" max="100" value="50"></label></p>
  <p><label>Seek <input id="seek" type="range" min="0" max="100" value="0"></label></p>
  <p><button id="btn-audio-start" type="button">Start audio capture</button>
     <button id="btn-audio-stop" type="button">Stop audio capture</button>
     <span id="audio-level">audio: idle</span></p>
  <!-- Throwaway: proves the analyser data is live. Replaced by Webamp's
       visualizer and Butterchurn later. -->
  <p><canvas id="viz-test" width="480" height="120"></canvas></p>
  <p><button id="signout" type="button">Sign out</button></p>
</div></section>

          <span style="display: block; width: 24px; height: 24px; border-radius: 12px; background: radial-gradient(circle at 38% 32%, #fff3bd 0%, #f5c518 44%, #a97f03 100%); box-shadow: 0 0 18px 4px rgba(245,197,24,.6), 0 0 7px 2px rgba(245,197,24,.85), inset 0 0 6px rgba(255,255,255,.6);"></span>
        </span>
      </button>
      <button type="button" class="sa-win" onClick="{{onPower}}" aria-label="{{powerLabel}}" aria-pressed="{{isOff}}" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; cursor: pointer; background: none;">
        <span style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 17px; background: linear-gradient(180deg, #767e85 0%, #b4bbc1 100%); box-shadow: inset 0 2px 4px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.85);">
          <span style="display: block; width: 24px; height: 24px; border-radius: 12px; background: radial-gradient(circle at 38% 32%, #ffc9c1 0%, #ef4136 44%, #8f1208 100%); box-shadow: 0 0 18px 4px rgba(239,65,54,.6), 0 0 7px 2px rgba(239,65,54,.85), inset 0 0 6px rgba(255,255,255,.5);"></span>
        </span>
      </button>

    <div style="position: relative; width: 996px; height: 429px; border-radius: 15px; overflow: hidden; background: linear-gradient(170deg, #12212e 0%, #0a141d 44%, #050b11 100%); box-shadow: inset 0 6px 16px rgba(0,0,0,.95), inset 0 -3px 10px rgba(90,140,190,.1), inset 0 0 0 1px rgba(150,190,225,.14);">

      <div style="position: absolute; left: 0px; top: 0px; right: 0px; bottom: 0px; opacity: {{screenOpacity}}; transition: opacity .25s ease;">

        <sc-if value="{{screenLogo}}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; left: 34px; top: 34px; display: flex; flex-direction: column; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 22px; line-height: 28px; letter-spacing: 1.6px; color: #7d878f; white-space: nowrap;">
            <span>BUILT FOR</span>

          </div>

          <div class="{{liveClass}}" style="position: absolute; right: 39px; bottom: 73px; height: 60px; display: flex; align-items: flex-end; gap: 4px; width: 126px">

          <div role="status" aria-live="polite" style="position: absolute; left: 34px; bottom: 34px; display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 21px; letter-spacing: 2.2px; color: {{statusColor}}; white-space: nowrap;">
            <sc-if value="{{statusIdle}}" hint-placeholder-val="{{ true }}">
              <span style="display: block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 7px; background: radial-gradient(circle at 38% 32%, #4a525a 0%, #2c3238 60%, #1a1e22 100%); box-shadow: inset 0 1px 2px rgba(0,0,0,.7), 0 0 0 1px rgba(150,190,225,.22);"></span>
            </sc-if>
            <sc-if value="{{statusBusy}}" hint-placeholder-val="{{ true }}">
              <span class="sa-spin" style="display: block; flex-shrink: 0; width: 14px; height: 14px; box-sizing: border-box; border-radius: 7px; border: 2px solid {{spinTrack}}; border-top-color: {{spinHead}};"></span>

            <sc-if value="{{statusOn}}" hint-placeholder-val="{{ true }}">

            <span>{{statusText}}</span>
          </div>
          <span style="position: absolute; right: 34px; bottom: 34px; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 21px; letter-spacing: 2.2px; color: #7d878f; text-align: right">EST. 2026</span>
        </sc-if>

        <sc-if value="{{screenOff}}" hint-placeholder-val="{{ true }}">

            <span style="display: block; width: 12px; height: 12px; border-radius: 6px; background: {{standbyDot}};"></span>
            <span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 22px; letter-spacing: 6px; color: #55606a;">{{standbyText}}</span>
          </div>
        </sc-if>
