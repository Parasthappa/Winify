<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/__webamp.css"><style>html,body{margin:0;height:100%;background:#08090b}#webamp-root{position:fixed;inset:0;z-index:1}</style></head>

  setWindowLevel: (l) => { rec('setWindowLevel', l); mock.windowLevel = l; setTimeout(() => (mock.levelListeners || []).forEach((fn) => fn(l)), 0); },
  onVisibility: (fn) => { visibilityListeners.push(fn); },
  setVisibleForTest: (v) => { WinifyAudio.setVisible(v); visibilityListeners.forEach((fn) => fn(v)); },

window.WinifyPlayer = {
  getDeviceId: () => 'winify-dev',
  getState: async () => mock.sdkState(),
  play: async () => { rec('play'); mock.setPaused(false); return true; },
  pause: async () => { rec('pause'); mock.setPaused(true); return true; },
  nextTrack: async () => { rec('nextTrack'); const l = mock.list();

    if (mock.lone && !mock.autoplayOn) { mock.setPaused(true); mock.position = 0; return true; }   // nothing after it: it stops

    if (l && !mock.autoplayOn && mock.idx === l.length - 1 && mock.repeat !== 'context') { mock.startAutoplay(true); return true; }

  previousTrack: async () => { rec('previousTrack'); const l = mock.list(); if (l) mock.track = l[--mock.idx]; else mock.track--; mock.position = 0; mock.at = Date.now(); return true; },
  seek: async (ms) => { rec('seek', ms); mock.position = ms; mock.at = Date.now(); return true; },
  setVolume: async (f) => { rec('setVolume', f); mock.volume = Math.round(f * 100); return true; },
  getVolume: async () => (mock.active === 'winify' ? mock.volume / 100 : null),
  onStateChange: (fn) => { mock.stateListeners = (mock.stateListeners || []).concat(fn); return () => {}; },
  transferPlaybackHere: (play) => window.spotify.transferPlayback('winify-dev', play).then((r) => r.ok),

const realFetch = window.fetch;

      artists: [{ name: 'Artist ' + i, uri: 'spotify:artist:sa' + i }], album: { name: i === 3 || i === 15 ? 'Insomniac (Deluxe Edition) - 25th Anniversary Remaster' : i < 12 ? 'Album a1' : i === 12 ? 'A Single' : 'Other ' + i, uri: i < 12 ? 'spotify:album:a1' : i === 12 ? 'spotify:album:s1' : 'spotify:album:x' + i, total_tracks: i < 12 ? 12 : i === 12 ? 1 : 30 }, duration_ms: 180000 + i * 1000, is_playable: i !== 5 }));
